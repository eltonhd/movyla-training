<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Exercício - MOVYLA Training</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='movyla.css') }}">
</head>

<body>

<div class="container">

    <!-- ===================================================== -->
    <!-- CABEÇALHO -->
    <!-- ===================================================== -->

    <div class="topo-pagina">

        <div>
            <h1>🏋️ Novo exercício</h1>

            <p class="texto-muted">
                Cadastre um exercício para utilizar nos seus treinos.
            </p>
        </div>

        <a href="{{ url_for('exercicios') }}"
           class="btn btn-secondary">
            ← Voltar
        </a>

    </div>


    <!-- ===================================================== -->
    <!-- MENSAGEM DE ERRO -->
    <!-- ===================================================== -->

    {% if erro %}

    <div class="alert alert-danger"
         style="
            margin-top: 20px;
            border-radius: 12px;
            padding: 16px;
         ">

        ⚠️ {{ erro }}

    </div>

    {% endif %}


    <!-- ===================================================== -->
    <!-- FORMULÁRIO -->
    <!-- ===================================================== -->

    <div class="card"
         style="
            max-width: 700px;
            margin: 30px auto;
         ">

        <form method="POST">


            <!-- ================================================= -->
            <!-- NOME -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="nome">
                    Nome do exercício
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Ex.: Crucifixo Invertido na Máquina"
                    value="{{ request.form.get('nome', '') }}"
                    required
                    autofocus
                >

            </div>


            <!-- ================================================= -->
            <!-- GRUPO MUSCULAR -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="grupo_muscular">
                    Grupo muscular
                </label>

                <select
                    id="grupo_muscular"
                    name="grupo_muscular"
                    required
                >

                    <option value="">
                        Selecione o grupo muscular
                    </option>

                    {% for grupo in grupos_musculares %}

                    <option
                        value="{{ grupo }}"
                        {% if request.form.get('grupo_muscular') == grupo %}
                            selected
                        {% endif %}
                    >
                        {{ grupo }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- ================================================= -->
            <!-- REPETIÇÕES -->
            <!-- ================================================= -->

            <div
                style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 16px;
                "
            >

                <div class="form-group">

                    <label for="repeticoes_min">
                        Repetições mínimas
                    </label>

                    <input
                        type="number"
                        id="repeticoes_min"
                        name="repeticoes_min"
                        min="1"
                        step="1"
                        placeholder="Ex.: 8"
                        value="{{ request.form.get('repeticoes_min', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="repeticoes_max">
                        Repetições máximas
                    </label>

                    <input
                        type="number"
                        id="repeticoes_max"
                        name="repeticoes_max"
                        min="1"
                        step="1"
                        placeholder="Ex.: 12"
                        value="{{ request.form.get('repeticoes_max', '') }}"
                        required
                    >

                </div>

            </div>


            <!-- ================================================= -->
            <!-- INCREMENTO -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="incremento_carga">
                    Incremento de carga (kg)
                </label>

                <input
                    type="number"
                    id="incremento_carga"
                    name="incremento_carga"
                    min="0.1"
                    step="0.1"
                    placeholder="Ex.: 2.5"
                    value="{{ request.form.get('incremento_carga', '2.5') }}"
                    required
                >

                <small
                    class="texto-muted"
                    style="
                        display: block;
                        margin-top: 8px;
                    "
                >
                    Valor utilizado pela progressão automática
                    deste exercício.
                </small>

            </div>


            <!-- ================================================= -->
            <!-- YOUTUBE -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="video_url">

                    🎥 Vídeo demonstrativo no YouTube

                    <span class="texto-muted">
                        (opcional)
                    </span>

                </label>

                <input
                    type="url"
                    id="video_url"
                    name="video_url"
                    placeholder="https://www.youtube.com/watch?v=..."
                    value="{{ request.form.get('video_url', '') }}"
                >

                <small
                    class="texto-muted"
                    style="
                        display: block;
                        margin-top: 8px;
                    "
                >

                    O aluno poderá acessar este vídeo diretamente
                    na tela do treino.

                </small>

            </div>


            <!-- ================================================= -->
            <!-- BOTÕES -->
            <!-- ================================================= -->

            <div
                style="
                    display: flex;
                    gap: 12px;
                    margin-top: 30px;
                    flex-wrap: wrap;
                "
            >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    💾 Cadastrar exercício
                </button>


                <a
                    href="{{ url_for('exercicios') }}"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
