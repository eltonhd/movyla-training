<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar senha | MOVYLA Training</title>
<style>body{background:#080b0a;color:#f5f8f5;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(90%,400px);background:#142019;padding:32px;border-radius:16px}h1{color:#b7f657;font-size:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #244536}button{background:#43e581;font-weight:bold;cursor:pointer}a{color:#b7f657}p{line-height:1.5}</style></head>
<body><main><h1>Recuperar senha</h1><p>Informe o e-mail cadastrado no MOVYLA.</p>
{% if mensagem %}<div role="status" style="text-align:center"><div style="font-size:44px;color:#43e581" aria-hidden="true">✓</div><h1>Solicitação recebida!</h1><p>{{ mensagem }}</p><p>Confira também sua pasta de spam.</p><a href="/login" style="display:block;background:#43e581;color:#07120c;font-weight:bold;text-align:center;padding:14px;border-radius:8px;text-decoration:none">OK — Voltar ao login</a></div>{% else %}
<form method="post"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><button type="submit">Enviar instrucoes</button></form>
<p><a href="/login">Voltar ao login</a></p>{% endif %}</main></body></html>
