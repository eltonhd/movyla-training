<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha | MOVYLA Training</title>
<style>body{background:#080b0a;color:#f5f8f5;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(90%,400px);background:#142019;padding:32px;border-radius:16px}h1{color:#b7f657;font-size:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #244536}button{background:#43e581;font-weight:bold;cursor:pointer}a{color:#b7f657}p{line-height:1.5}</style></head>
<body><main><h1>Definir nova senha</h1>
{% if erro %}<p role="alert">{{ erro }}</p>{% endif %}
{% if token_valido is defined and not token_valido %}<p>Este link expirou ou ja foi utilizado.</p><p><a href="/esqueci-senha">Solicitar outro link</a></p>
{% else %}<form method="post"><label for="senha">Nova senha</label><input id="senha" name="senha" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><label for="confirmar_senha">Confirmar senha</label><input id="confirmar_senha" name="confirmar_senha" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><button type="submit">Salvar nova senha</button></form>{% endif %}
<p><a href="/login">Voltar ao login</a></p></main></body></html>
