<!DOCTYPE html>

    <link rel="stylesheet"

<body>

<div class="container">

    <div class="topo-pagina">

    <div

        <form method="POST">


            <!-- ================================================= -->
            <!-- NOME -->

            <div class="form-group">

                <label for="nome">

                <input
                    type="text"

                    name="nome"
                    value="{{ request.form.get('nome', exercicio['nome']) }}"

                    autofocus
                >

            </div>


            <!-- ================================================= -->
            <!-- GRUPO MUSCULAR -->
            <!-- ================================================= -->

            <div class="form-group">

                <label for="grupo_muscular">
                    Grupo muscular
                </label>

                <select
                    id="grupo_muscular"
                    name="grupo_muscular"
                    required
                >

                    <option value="">

                    </option>

                    {% for grupo in grupos_musculares %}

                    <option
                        value="{{ grupo }}"

                        {% endif %}
                    >

                    {% endfor %}

                </select>

            <!-- ================================================= -->

                "
            >

                <div class="form-group">

                        step="1"
                        value="{{ request.form.get('repeticoes_max', exercicio['repeticoes_max']) }}"
                        required
                    >

                </div>

            </div>


            <!-- ================================================= -->

            <div class="form-group">

                <label for="incremento_carga">
                    Incremento de carga (kg)
                </label>

                <input
                    type="number"
                    id="incremento_carga"
                    name="incremento_carga"
                    min="0.1"
                    step="0.1"
                    value="{{ request.form.get('incremento_carga', exercicio['incremento_carga']) }}"
                    required
                >

                <small
                    class="texto-muted"

                        margin-top: 8px;
                    "

</div>

</html>
