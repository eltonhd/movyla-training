name: Validar MOVYLA

on:
  push:
    branches:
      - desenvolvimento-seguro-20261013
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q app.py database.py planos.py cobrancas.py tests
      - name: Executar testes de vencimentos, planos e cobranças
        run: python -m unittest discover -s tests -v
